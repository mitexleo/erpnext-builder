name: Build ERPNext Custom Image

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if no new commits detected"
        required: false
        default: false
        type: boolean

env:
  DOCKER_IMAGE: mitexleo/syserp
  FRAPPE_BRANCH: version-16
  FRAPPE_REPO: frappe/frappe
  # Pin the frappe_docker build recipes to a release instead of tracking `main`.
  # Upstream v4.x introduced breaking build changes (Debian Trixie default base,
  # arbitrary-UID/permission handling, and a BuildKit >= 0.17 / Dockerfile
  # frontend >= 1.14 requirement for `# syntax` + `COPY --chmod=g=u`). Pin
  # deliberately and bump this when adopting a new frappe_docker release.
  FRAPPE_DOCKER_REF: v4.1.0

permissions:
  contents: write
  packages: write
  issues: write # Open/update the tracking issue when the frappe_docker pin is stale

concurrency:
  group: build-erpnext-custom-image
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check_updates.outputs.changed }}
      new_version: ${{ steps.version.outputs.new_version }}
      cache_bust: ${{ steps.cache_bust.outputs.value }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Validate required files
        id: validate_files
        run: |
          if [ ! -f "apps.json" ]; then
            echo "Error: apps.json not found"
            exit 1
          fi
          CREATED_FILES=false
          if [ ! -f "REPO_VERSIONS.json" ]; then
            echo "Creating REPO_VERSIONS.json with empty object"
            echo "{}" > REPO_VERSIONS.json
            CREATED_FILES=true
          fi
          if [ ! -f "VERSION" ]; then
            echo "Creating VERSION file with initial version"
            echo "1.0.0" > VERSION
            CREATED_FILES=true
          fi
          echo "created_files=$CREATED_FILES" >> $GITHUB_OUTPUT

      - name: Commit initial files if created
        if: steps.validate_files.outputs.created_files == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          CURRENT_BRANCH=$(git branch --show-current)
          git add REPO_VERSIONS.json VERSION
          git commit -m "Initialize REPO_VERSIONS.json and VERSION files" || true
          git pull --rebase origin "$CURRENT_BRANCH" || true
          git push origin "$CURRENT_BRANCH" || true

      - name: Compute cache bust key
        id: cache_bust
        run: |
          # Invalidation key for the `bench init` layer. It changes when:
          #   - apps.json changes, or
          #   - the tracked repo versions (REPO_VERSIONS.json) change, i.e. a real update, or
          #   - a force build is requested, so `force_build` still forces a rebuild.
          # It deliberately does NOT change on every run, so re-running the same commit
          # reuses cached layers instead of re-downloading every dependency.
          APPS_HASH=$(sha256sum apps.json | awk '{print $1}')
          VERSION_HASH=$(sha256sum REPO_VERSIONS.json 2>/dev/null | awk '{print $1}' || echo "no-versions")
          FORCE_NONCE=""
          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            FORCE_NONCE="force-${{ github.run_id }}"
          fi
          COMBINED_HASH=$(echo "${APPS_HASH}-${VERSION_HASH}-${FORCE_NONCE}" | sha256sum | awk '{print $1}')
          echo "value=$COMBINED_HASH" >> $GITHUB_OUTPUT

      - name: Check for updates via git ls-remote
        id: check_updates
        run: |
          CHANGED=false
          CURRENT_VERSIONS=$(cat REPO_VERSIONS.json)

          # Check frappe/frappe (framework, not in apps.json)
          echo "Checking $FRAPPE_REPO branch: $FRAPPE_BRANCH..."
          LATEST_SHA=$(git ls-remote "https://github.com/$FRAPPE_REPO.git" "refs/heads/$FRAPPE_BRANCH" | awk '{print $1}')
          if [ -n "$LATEST_SHA" ]; then
            CURRENT_VERSION=$(echo "$CURRENT_VERSIONS" | jq -r --arg r "$FRAPPE_REPO" '.[$r] // "none"')
            if [ "$CURRENT_VERSION" != "$LATEST_SHA" ]; then
              CHANGED=true
              CURRENT_VERSIONS=$(echo "$CURRENT_VERSIONS" | jq --arg r "$FRAPPE_REPO" --arg v "$LATEST_SHA" '.[$r]=$v')
              echo "✓ $FRAPPE_REPO changed: ${LATEST_SHA:0:12}"
            fi
          else
            echo "⚠️ Could not resolve $FRAPPE_BRANCH for $FRAPPE_REPO"
          fi

          # Check each app from apps.json
          while IFS= read -r app; do
            [ -z "$app" ] && continue

            URL=$(echo "$app" | jq -r '.url')
            BRANCH=$(echo "$app" | jq -r '.branch')
            # Extract org/repo from URL: https://github.com/org/repo -> org/repo
            REPO=$(echo "$URL" | sed -E 's|https://github.com/([^/]+/[^/]+).*|\1|')

            echo "Checking $REPO branch: $BRANCH..."

            # Try branch first, then tag
            LATEST_SHA=$(git ls-remote "$URL.git" "refs/heads/$BRANCH" | awk '{print $1}')
            if [ -z "$LATEST_SHA" ]; then
              LATEST_SHA=$(git ls-remote "$URL.git" "refs/tags/$BRANCH" | awk '{print $1}')
            fi

            if [ -z "$LATEST_SHA" ]; then
              echo "⚠️ Could not resolve $BRANCH for $REPO, skipping..."
              continue
            fi

            CURRENT_VERSION=$(echo "$CURRENT_VERSIONS" | jq -r --arg r "$REPO" '.[$r] // "none"')

            if [ "$CURRENT_VERSION" != "$LATEST_SHA" ]; then
              CHANGED=true
              CURRENT_VERSIONS=$(echo "$CURRENT_VERSIONS" | jq --arg r "$REPO" --arg v "$LATEST_SHA" '.[$r]=$v')
              echo "✓ $REPO changed: ${LATEST_SHA:0:12}"
            else
              echo "  $REPO unchanged"
            fi
          done < <(jq -c '.[]' apps.json)

          # Check if force build is requested
          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "Force build requested via manual trigger"
            CHANGED=true
          fi

          echo "$CURRENT_VERSIONS" > REPO_VERSIONS.json
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

          if [ "$CHANGED" = "false" ]; then
            echo "No updates detected. Build will be skipped."
          else
            echo "Updates detected or force build requested. Proceeding with build."
          fi

      - name: Increment image version
        if: steps.check_updates.outputs.changed == 'true'
        id: version
        run: |
          CURRENT_VERSION=$(cat VERSION)
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          NEW_PATCH=$((patch + 1))
          NEW_VERSION="$major.$minor.$NEW_PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "$NEW_VERSION" > VERSION
          echo "Version bumped to: $NEW_VERSION"

      - name: Commit updated files
        if: steps.check_updates.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          CURRENT_BRANCH=$(git branch --show-current)
          git add REPO_VERSIONS.json VERSION
          git commit -m "Update versions and bump to ${{ steps.version.outputs.new_version }}" || true
          # Pull --rebase to avoid conflicts with concurrent runs
          git pull --rebase origin "$CURRENT_BRANCH" || true
          git push origin "$CURRENT_BRANCH" || true

      # Pinning frappe_docker protects us from silent upstream breakage, but it can
      # also silently rot. Resolve the newest upstream release tag every run and
      # surface it (warning + tracking issue) when our pin falls behind.
      - name: Check pinned frappe_docker version against upstream releases
        id: frappe_docker_check
        run: |
          PINNED="${{ env.FRAPPE_DOCKER_REF }}"
          LATEST="$(git ls-remote --tags --refs https://github.com/frappe/frappe_docker.git 2>/dev/null \
            | awk -F'refs/tags/' '{print $2}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1 || true)"

          echo "Pinned: $PINNED"
          echo "Latest upstream release: ${LATEST:-<none found>}"

          if [ -z "$LATEST" ]; then
            echo "::warning::Could not resolve an upstream frappe_docker release tag; skipping comparison."
            echo "outdated=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "pinned=$PINNED" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

          if [ "$LATEST" != "$PINNED" ]; then
            echo "outdated=true" >> $GITHUB_OUTPUT
            echo "::warning::frappe_docker $LATEST is available but the workflow pins $PINNED. Review https://github.com/frappe/frappe_docker/releases and bump FRAPPE_DOCKER_REF."
          else
            echo "outdated=false" >> $GITHUB_OUTPUT
            echo "frappe_docker pin $PINNED is already the latest release."
          fi

      - name: Open/update tracking issue when the pin is stale
        if: steps.frappe_docker_check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED: ${{ steps.frappe_docker_check.outputs.pinned }}
          LATEST: ${{ steps.frappe_docker_check.outputs.latest }}
        run: |
          TITLE="frappe_docker pin is out of date"
          BODY="The build workflow pins \`frappe_docker\` to **${PINNED}**, but a newer upstream release (**${LATEST}**) is available.

          Review the release notes for breaking build-recipe changes, then bump \`FRAPPE_DOCKER_REF\` in \`.github/workflows/build.yml\` after validating the build:

          - Releases: https://github.com/frappe/frappe_docker/releases
          - Latest run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          _Created automatically by the build workflow; it updates in place while the pin stays stale._"

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
            echo "Updated existing tracking issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  build-and-push:
    needs: check-updates
    if: needs.check-updates.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Clone frappe_docker (${{ env.FRAPPE_DOCKER_REF }})
        run: git clone --depth 1 --branch "${{ env.FRAPPE_DOCKER_REF }}" https://github.com/frappe/frappe_docker

      - name: Copy apps.json into build context
        run: cp apps.json frappe_docker/apps.json

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        env:
          NEW_VERSION: ${{ needs.check-updates.outputs.new_version }}
          CACHE_BUST: ${{ needs.check-updates.outputs.cache_bust }}
        shell: bash
        run: |
          # `bench init` downloads the entire JS dependency tree for frappe and every
          # app from the public npm/yarn registry. A single transient registry 5xx
          # (e.g. 'chai-6.2.2.tgz: Request failed "503 Service Unavailable"' while
          # installing the crm app) aborts the whole build, so retry with backoff.
          set +e
          cd frappe_docker
          max_attempts=3
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::group::docker buildx build (attempt ${attempt}/${max_attempts})"
            docker buildx build \
              --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe \
              --build-arg=FRAPPE_BRANCH="${FRAPPE_BRANCH}" \
              --build-arg=FRAPPE_IMAGE_PREFIX=frappe \
              --build-arg=CACHE_BUST="${CACHE_BUST}" \
              --secret id=apps_json,src="${GITHUB_WORKSPACE}/frappe_docker/apps.json" \
              --cache-from type=registry,ref="${DOCKER_IMAGE}:latest" \
              --cache-to type=inline \
              --load \
              --tag "${DOCKER_IMAGE}:${NEW_VERSION}" \
              --tag "${DOCKER_IMAGE}:latest" \
              --file images/layered/Containerfile .
            rc=$?
            echo "::endgroup::"

            if [ "$rc" -eq 0 ]; then
              echo "Image build succeeded on attempt ${attempt}."
              exit 0
            fi

            echo "::warning::docker buildx build failed (exit ${rc}) on attempt ${attempt}/${max_attempts}."
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$max_attempts" ]; then
              backoff=$(((attempt - 1) * 30))
              echo "Retrying in ${backoff}s..."
              sleep "$backoff"
            fi
          done

          echo "::error::Image build failed after ${max_attempts} attempts."
          exit 1

      - name: Push Docker image
        env:
          NEW_VERSION: ${{ needs.check-updates.outputs.new_version }}
        run: |
          docker push "${{ env.DOCKER_IMAGE }}:$NEW_VERSION"
          docker push "${{ env.DOCKER_IMAGE }}:latest"
